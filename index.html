    <div class="nokta" id="nokta"></div>
    <h1 id="baslik">Kontrol ediliyor…</h1>
    <p id="yazi">PC'ye bakıyorum.</p>
  </main>
  <script>
    "use strict";
    const REPO = "croslop/spor-sm-durum";
    const anahtar = new URLSearchParams(location.hash.slice(1)).get("anahtar");
    const el = (id) => document.getElementById(id);
    let adres = null;
    let adresZamani = 0;

    function goster(sinif, baslik, yazi) {
      el("nokta").className = "nokta " + sinif;
      el("baslik").textContent = baslik;
      el("yazi").textContent = yazi;
    }

    async function adresGetir() {
      const cevap = await fetch(`https://api.github.com/repos/${REPO}/contents/adres.json`, {
        headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store",
      });
      if (!cevap.ok) throw new Error("adres okunamadı");
      return (await cevap.json()).adres;
    }

    async function acikMi(url) {
      const cevap = await fetch(`${url}/api/saglik`, { cache: "no-store", signal: AbortSignal.timeout(8000) });
      return cevap.ok && (await cevap.json()).acik === true;
    }

    async function kontrol() {
      try {
        // GitHub saatlik sorgu sınırı nedeniyle adres 90 saniyede bir yenilenir.
        if (!adres || Date.now() - adresZamani > 90000) {
          adres = await adresGetir();
          adresZamani = Date.now();
        }
        if (adres && await acikMi(adres)) {
          goster("acik", "PC açık", "Uygulamaya geçiliyor…");
          location.replace(`${adres}/giris?anahtar=${encodeURIComponent(anahtar)}`);
          return;
        }
      } catch {
        adresZamani = 0;
      }
      goster("kapali", "PC kapalı", "Şu an video yüklenemez. PC açılınca bu sayfa kendiliğinden geçiş yapar.");
      setTimeout(kontrol, 20000);
    }

    if (anahtar) kontrol();
    else goster("kapali", "Link eksik", "Bu sayfayı sana gönderilen tam linkten aç.");
  </script>
</body>
